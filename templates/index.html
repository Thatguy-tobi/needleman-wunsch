<!DOCTYPE html>
<html>
<head>
    <title>Global Alignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">📊 Global Alignment</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <label>Sequence 1</label>
                    <input type="text" name="seq1" class="form-control mb-2" required>
                    
                    <label>Sequence 2</label>
                    <input type="text" name="seq2" class="form-control mb-3" required>
                    
                    <button type="submit" class="btn btn-info text-white w-100">Calculate Score</button>
                </form>

                {% if score is not none %}
                <div class="alert alert-info mt-3">
                    <strong>Global Alignment Score:</strong> {{ score }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
